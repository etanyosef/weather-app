<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather App</title>
    </head>
    <body>
        <header>
            <h1>Weather App</h1>
            <nav>
                <form id="search-weather-form" class="search-weather-form">
                    <input type="text" name="location-input" id="location-input" placeholder="Search for location" required>
                    <button type="submit" id="search-btn">Search</button>
                </form>

                <div class="temp-toggle-container">
                    <button class="fahrenheit-button">°F</button>
                    <button class="celcius-button active">°C</button>
                </div>
            </nav>
        </header>
        <div class="loader"></div>
        <main id="content"></main>
    </body>
</html>
